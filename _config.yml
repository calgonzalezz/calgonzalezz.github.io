title: "Carlos Gonzalez-Regalado"
description: "Economist and policy researcher. Director of the Economics Program, Universidad UTE, Quito."
author: "Carlos Gonzalez-Regalado"
email: "calgonzalezz@gmail.com"
url: "https://calgonzalezz.github.io"
baseurl: ""
locale: "en-US"

# Author profile (sidebar)
author_profile:
  name: "Carlos Gonzalez-Regalado"
  role: "Director of Economics · UTE"
  role_es: "Director de Economía · UTE"
  location: "Quito, Ecuador"
  avatar: "/assets/images/profile.jpg"
  links:
    - label: "Email"
      label_es: "Correo"
      url: "mailto:calgonzalezz@gmail.com"
    - label: "LinkedIn"
      url: "https://www.linkedin.com/in/carlos-gonzalez-regaladob/"
    - label: "GitHub"
      url: "https://github.com/calgonzalezz"
    - label: "Google Scholar"
      url: "https://scholar.google.com/citations?user=nk5TBfMAAAAJ"
    - label: "ORCID"
      url: "https://orcid.org/0009-0002-3313-9984"

# Analytics and search
# Google Analytics 4 measurement ID (e.g. "G-XXXXXXXXXX"); empty = GA4 off.
google_analytics_id: "G-2NYQVYSHHF"
# Search Console: uncomment and paste only the content="..." value of the
# HTML-tag verification.
# webmaster_verifications:
#   google: ""

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: true   # single line breaks in Markdown become <br> (CV entries rely on this)
permalink: pretty
paginate: 5
paginate_path: "/page:num/"

include:
  - _pages

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

# Link previews (WhatsApp, LinkedIn, X): large image card
twitter:
  card: summary_large_image

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
      author_profile: true
      image: /assets/images/og-card-en.png
  - scope:
      path: "_pages/es"
    values:
      image: /assets/images/og-card-es.png

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
