<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1E3A5F">

  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  {% seo %}

  <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  {% if page.alt_url %}
  <link rel="alternate" hreflang="{% if page.lang == 'es' %}es{% else %}en{% endif %}" href="{{ page.url | absolute_url }}">
  <link rel="alternate" hreflang="{% if page.lang == 'es' %}en{% else %}es{% endif %}" href="{{ page.alt_url | absolute_url }}">
  {% endif %}

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+Pro:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}">

  {% if site.google_analytics_id and site.google_analytics_id != "" %}
  <!-- Google Analytics 4 with Consent Mode: no analytics cookies until the visitor accepts -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    var gaConsent = null;
    try { gaConsent = localStorage.getItem('ga-consent'); } catch (e) {}
    gtag('consent', 'default', {
      analytics_storage: gaConsent === 'granted' ? 'granted' : 'denied',
      ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied'
    });
    gtag('js', new Date());
    gtag('config', '{{ site.google_analytics_id }}');
  </script>
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics_id }}"></script>
  {% endif %}

  <!-- GoatCounter analytics -->
  <script data-goatcounter="https://cgonzalezr.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</head>
